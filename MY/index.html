<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆借阅月报看板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
    .card-item { cursor: pointer; transition: 0.2s; }
    .stat-card { min-height: 150px; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">图书馆借阅月报看板</h1>
    <p class="text-muted" id="source-info"></p>
  </header>
  <p id="status" class="alert alert-warning"></p>
  <section class="row g-3 mb-4" id="card-wrap"></section>
  <section class="row g-3 mb-4" id="summary-wrap"></section>
  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各分类每月借阅量（ECharts-柱状图｜单位：册）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">12个月借阅趋势（Chart.js-折线图｜单位：册）</h2>
      <div class="chart-box">
        <canvas id="line-chart"></canvas>
      </div>
    </div>
  </section>
  <section class="row g-3 mt-2">
    <div class="col-12">
      <h2 class="h5">各分类借阅占比研究（独立研究任务）</h2>
      <div id="ratio-chart" class="chart-box"></div>r
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
